name: Refresh forecast model

on:
  schedule:
    # hourly: GitHub silently skips many scheduled runs under load (the old
    # 3-hourly schedule actually ran every 5-7h), so ask often. Off the hour
    # because :00 is the most congested slot.
    - cron: "37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-model.mjs
      - name: Commit data
        run: |
          git config user.name "model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model.json
          git diff --cached --quiet || git commit -m "Update forecast model data"
          # main may have moved while the fetch ran (a PR merge)
          git pull --rebase origin main
          git push
